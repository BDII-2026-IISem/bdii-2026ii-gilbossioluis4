<div class="min-h-screen flex flex-col bg-slate-50">
  <header class="bg-white border-b border-slate-200 p-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button pButton type="button" icon="pi pi-bars" severity="secondary" text aria-label="Abrir menú de navegación" (click)="toggleMenu()"></button>
      <h1 class="text-xl font-bold text-slate-800">{{ title() }}</h1>
    </div>
  </header>

  <div class="flex flex-1">
    @if (asideVisible()) {
      <aside class="w-64 bg-white border-r border-slate-200 p-4 hidden md:block">
        <nav class="flex flex-col gap-2">
          <button pButton type="button" text (click)="selectOption('Inicio')">Inicio</button>
          <button pButton type="button" text (click)="selectOption('Clientes')">Clientes</button>
          <button pButton type="button" text (click)="selectOption('Tipos de producto')">Tipos de producto</button>
          <button pButton type="button" text (click)="selectOption('Productos')">Productos</button>
          <button pButton type="button" text (click)="selectOption('Ventas')">Ventas</button>
        </nav>
      </aside>
    }

    <main class="flex-1 p-6">
      <p class="text-slate-600">Prototipo estático de navegación en construcción.</p>
    </main>
  </div>
</div>

<p-drawer [visible]="drawerVisible()" (visibleChange)="drawerVisible.set($event)" header="Menú de navegación">
  <nav class="flex flex-col gap-2">
    <button pButton type="button" text (click)="selectOption('Inicio')">Inicio</button>
    <button pButton type="button" text (click)="selectOption('Clientes')">Clientes</button>
    <button pButton type="button" text (click)="selectOption('Tipos de producto')">Tipos de producto</button>
    <button pButton type="button" text (click)="selectOption('Productos')">Productos</button>
    <button pButton type="button" text (click)="selectOption('Ventas')">Ventas</button>
  </nav>
</p-drawer>
