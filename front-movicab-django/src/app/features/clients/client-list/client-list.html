<app-page-header title="Clientes / Pasajeros" subtitle="La baja es lógica: el cliente queda inactivo pero conserva su historial.">
  <p-tag [value]="rows().length + ' registros'" severity="info" [rounded]="true" />
  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo cliente</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  dataKey="id"
  tableStyleClass="min-w-3xl"
  [paginator]="visibleRows().length > 10"
  [rows]="10"
>
  <ng-template #caption>
    <input
      pInputText
      type="search"
      class="w-full"
      aria-label="Buscar clientes"
      placeholder="Buscar por nombre, email o teléfono…"
      [value]="filter()"
      (input)="filter.set($any($event.target).value)"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Nombre <p-sort-icon field="name" /></th>
      <th pSortableColumn="email">Contacto <p-sort-icon field="email" /></th>
      <th>Estado</th>
      <th class="w-32 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-client>
    <tr>
      <td>
        <p class="font-medium text-slate-800">{{ client.name }}</p>
        <p class="text-xs text-slate-400">#{{ client.id }}</p>
      </td>
      <td>
        <p class="text-sm text-slate-700">{{ client.email || '—' }}</p>
        <p class="text-xs text-slate-400">{{ client.phone || 'Sin teléfono' }}</p>
      </td>
      <td><app-status-tag [status]="client.status" /></td>
      <td class="text-right">
        <button pButton type="button" text rounded severity="secondary" icon="pi pi-pencil" aria-label="Editar cliente" pTooltip="Editar" (click)="openEdit(client)"></button>
        <button pButton type="button" text rounded severity="danger" icon="pi pi-trash" aria-label="Dar de baja al cliente" pTooltip="Dar de baja" [disabled]="client.status === 'inactive'" (click)="remove(client)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        @if (filter()) {
          <app-empty-state icon="pi pi-search" title="Sin coincidencias" message="Ningún cliente coincide. Borra el filtro para ver todos." />
        } @else {
          <app-empty-state icon="pi pi-users" title="Sin clientes" message="Crea el primero con «Nuevo cliente» o ejecuta el seeder en Django." />
        }
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editing() ? 'Editar cliente' : 'Nuevo cliente'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-client-form
    [client]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>

<p-confirmdialog />
