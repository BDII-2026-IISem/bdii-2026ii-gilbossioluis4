<app-page-header title="Pasajeros" subtitle="La baja es lógica y conserva el historial de carreras.">
  <p-tag [value]="rows().length + ' registros'" severity="info" [rounded]="true" />
  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo pasajero</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  dataKey="id"
  tableStyleClass="min-w-3xl"
  [paginator]="visibleRows().length > 10"
  [rows]="10"
>
  <ng-template #caption>
    <input
      pInputText
      type="search"
      class="w-full"
      aria-label="Buscar pasajeros"
      placeholder="Buscar por nombre, email o descripción..."
      [value]="filter()"
      (input)="filter.set($any($event.target).value)"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="nombre">Nombre <p-sort-icon field="nombre" /></th>
      <th pSortableColumn="email">Contacto <p-sort-icon field="email" /></th>
      <th>Estado</th>
      <th class="w-32 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-pasajero>
    <tr>
      <td>
        <p class="font-medium text-slate-800">{{ pasajero.nombre }}</p>
        <p class="text-xs text-slate-400">#{{ pasajero.id }}</p>
      </td>
      <td>
        <p class="text-sm text-slate-700">{{ pasajero.email || 'Sin correo' }}</p>
        <p class="text-xs text-slate-400">{{ pasajero.descripcion || 'Sin descripción' }}</p>
      </td>
      <td><app-status-tag [status]="pasajero.status" /></td>
      <td class="text-right">
        <button pButton type="button" text rounded severity="secondary" icon="pi pi-pencil" aria-label="Editar pasajero" pTooltip="Editar" (click)="openEdit(pasajero)"></button>
        <button pButton type="button" text rounded severity="danger" icon="pi pi-trash" aria-label="Dar de baja al pasajero" pTooltip="Dar de baja" [disabled]="pasajero.status === 'inactive'" (click)="remove(pasajero)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        @if (filter()) {
          <app-empty-state icon="pi pi-search" title="Sin coincidencias" message="Ningún pasajero coincide. Borra el filtro para ver todos." />
        } @else {
          <app-empty-state icon="pi pi-users" title="Sin pasajeros" message="Registra el primer pasajero o revisa los datos en Django." />
        }
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editing() ? 'Editar pasajero' : 'Nuevo pasajero'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-pasajero-form
    [pasajero]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>

<p-confirmdialog />
