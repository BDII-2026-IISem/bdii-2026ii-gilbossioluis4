<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4">
  <div class="flex flex-col gap-2">
    <label for="pasajero-nombre">Nombre <span class="text-red-500">*</span></label>
    <input id="pasajero-nombre" pInputText formControlName="nombre" class="w-full" placeholder="Ej. Ana Torres" autocomplete="name" />
    @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
      <p-message severity="error" size="small" variant="simple">El nombre es obligatorio y debe tener al menos 2 caracteres.</p-message>
    }
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div class="flex flex-col gap-2">
      <label for="pasajero-email">Correo electrónico</label>
      <input id="pasajero-email" type="email" pInputText formControlName="email" class="w-full" placeholder="ana@movicab.test" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p-message severity="error" size="small" variant="simple">Formato de email inválido.</p-message>
      }
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label for="pasajero-descripcion">Descripción</label>
    <textarea id="pasajero-descripcion" pTextarea formControlName="descripcion" rows="2" placeholder="Información adicional" class="w-full"></textarea>
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button pButton type="button" severity="secondary" outlined (click)="cancelled.emit()"><span pButtonLabel>Cancelar</span></button>
    <button pButton type="submit" [loading]="saving()"><i pButtonIcon class="pi pi-check"></i><span pButtonLabel>Guardar</span></button>
  </div>
</form>
