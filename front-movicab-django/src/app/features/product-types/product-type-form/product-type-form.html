<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4">
  <div class="flex flex-col gap-2">
    <label for="type-name">Nombre del tipo / categoría <span class="text-red-500">*</span></label>
    <input
      id="type-name"
      pInputText
      formControlName="name"
      class="w-full"
      placeholder="Ej. Servicio Ejecutivo / Carga"
      autocomplete="off"
    />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p-message severity="error" size="small" variant="simple">
        El nombre es obligatorio y debe tener entre 2 y 100 caracteres.
      </p-message>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="type-description">Descripción</label>
    <textarea
      id="type-description"
      pTextarea
      formControlName="description"
      rows="3"
      placeholder="Descripción opcional del servicio o categoría..."
      class="w-full"
    ></textarea>
  </div>

  <div class="flex justify-end gap-2 border-t border-slate-100 pt-4">
    <button pButton type="button" severity="secondary" outlined (click)="cancelled.emit()">
      <span pButtonLabel>Cancelar</span>
    </button>
    <button pButton type="submit" [loading]="saving()">
      <i pButtonIcon class="pi pi-check"></i>
      <span pButtonLabel>Guardar</span>
    </button>
  </div>
</form>
