<app-page-header title="Tipos de producto / Categorías" subtitle="Gestiona las categorías de servicios y productos activos.">
  <p-tag [value]="rows().length + ' activos'" severity="info" [rounded]="true" />
  <button pButton type="button" (click)="openCreate()">
    <i pButtonIcon class="pi pi-plus"></i><span pButtonLabel>Nuevo tipo</span>
  </button>
</app-page-header>

@if (error()) {
  <p-message severity="error" styleClass="mb-4 w-full">{{ error() }}</p-message>
}

<p-table
  [value]="visibleRows()"
  [loading]="loading()"
  dataKey="id"
  tableStyleClass="min-w-3xl"
  [paginator]="visibleRows().length > 10"
  [rows]="10"
>
  <ng-template #caption>
    <input
      pInputText
      type="search"
      class="w-full"
      aria-label="Buscar tipos"
      placeholder="Buscar por nombre o descripción…"
      [value]="filter()"
      (input)="filter.set($any($event.target).value)"
    />
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Nombre <p-sort-icon field="name" /></th>
      <th>Descripción</th>
      <th>Estado</th>
      <th class="w-32 text-right">Acciones</th>
    </tr>
  </ng-template>

  <ng-template #body let-type>
    <tr>
      <td>
        <p class="font-medium text-slate-800">{{ type.name }}</p>
        <p class="text-xs text-slate-400">#{{ type.id }}</p>
      </td>
      <td>
        <p class="text-sm text-slate-600">{{ type.description || '—' }}</p>
      </td>
      <td><app-status-tag [status]="type.status" /></td>
      <td class="text-right">
        <button pButton type="button" text rounded severity="secondary" icon="pi pi-pencil" aria-label="Editar tipo" pTooltip="Editar" (click)="openEdit(type)"></button>
        <button pButton type="button" text rounded severity="danger" icon="pi pi-trash" aria-label="Dar de baja tipo" pTooltip="Desactivar" (click)="remove(type)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="4">
        @if (filter()) {
          <app-empty-state icon="pi pi-search" title="Sin coincidencias" message="Ningún tipo coincide. Borra el filtro para ver todos." />
        } @else {
          <app-empty-state icon="pi pi-tags" title="Sin tipos activos" message="Crea el primero con «Nuevo tipo» o ejecuta el seeder en Django." />
        }
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editing() ? 'Editar tipo de producto' : 'Nuevo tipo de producto'"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="w-full max-w-2xl mx-4"
>
  <app-product-type-form
    [productType]="editing()"
    [saving]="saving()"
    [resetKey]="resetKey()"
    (saved)="save($event)"
    (cancelled)="dialogVisible.set(false)"
  />
</p-dialog>

<p-confirmdialog />
