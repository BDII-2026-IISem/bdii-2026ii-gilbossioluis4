<div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <p-card styleClass="w-full max-w-md shadow-lg border-0">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">MoviCab</h1>
      <p class="text-sm text-slate-500 mt-1">Ingresa tus credenciales para acceder</p>
    </div>

    @if (error()) {
      <p-message severity="error" styleClass="w-full mb-4">{{ error() }}</p-message>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label for="identifier" class="text-sm font-medium text-slate-700">Usuario o Correo</label>
        <input
          pInputText
          id="identifier"
          formControlName="identifier"
          placeholder="admin o usuario@ejemplo.com"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-slate-700">Contraseña</label>
        <p-password
          id="password"
          formControlName="password"
          [toggleMask]="true"
          [feedback]="false"
          [fluid]="true"
          placeholder="••••••••"
        />
      </div>

      <button pButton type="submit" [loading]="loading()" class="w-full mt-2">
        <i pButtonIcon class="pi pi-sign-in"></i>
        <span pButtonLabel>Iniciar sesión</span>
      </button>
    </form>
  </p-card>
</div>
